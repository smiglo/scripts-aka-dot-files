<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <match target="pattern">
        <test name="family"><string>FiraCode Nerd Font</string></test>
        <edit name="family" mode="append" binding="weak">
            <string>Noto Color Emoji</string>
            <string>Font Awesome 7 Free Solid</string>
            <string>Noto Sans Symbols</string> </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>FiraCode Nerd Font</string></test>
        <test name="charset" compare="contains">
            <charset><int>0x262F</int></charset>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans Symbols</string>
        </edit>
    </match>

    <!--
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hinting" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
        <edit name="rgba" mode="assign">
            <const>rgb</const>
        </edit>
        <edit name="autohint" mode="assign">
            <bool>false</bool>
        </edit>
        <edit name="lcdfilter" mode="assign">
            <const>lcdnone</const>
        </edit>
        <edit name="dpi" mode="assign">
            <double>96</double>
        </edit>
    </match>
    -->

</fontconfig>
